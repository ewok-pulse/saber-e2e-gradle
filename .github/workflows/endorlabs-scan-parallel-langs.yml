# ─────────────────────────────────────────────────────────────────
# Generated by Saber v0.1.0 on 2026-07-17 for gradle
#
#   Languages:    java
#   Build:        gradle
#   Namespace:    endor-solutions-ypulse.github-ci.saber-e2e
#   Auth:         GitHub OIDC (keyless)
#   PR behavior:  comment on PR (non-blocking)
#   PR scan mode: quick
#
# Regenerate this file with `saber scan repo` (point at this repo's path).
# Hand-edits will be overwritten on the next regeneration.
# ─────────────────────────────────────────────────────────────────
#
# Saber split one or more scan units to fit standard runner memory:
#   • java: 8 shards (platforms, build-logic, build-logic-commons, build-logic-settings, packaging, subprojects, .teamcity, root)
#     Saber split the java scan into multiple jobs because this repo has 2364
#     java root manifests — a single full-reachability scan exceeds the
#     ubuntu-latest runner memory budget. Each shard scans one top-level
#     subtree with full reachability preserved.
#
name: Endor Labs Scan
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      java-platforms: ${{ steps.filter.outputs.java-platforms }}
      java-build-logic: ${{ steps.filter.outputs.java-build-logic }}
      java-build-logic-commons: ${{ steps.filter.outputs.java-build-logic-commons }}
      java-build-logic-settings: ${{ steps.filter.outputs.java-build-logic-settings }}
      java-packaging: ${{ steps.filter.outputs.java-packaging }}
      java-subprojects: ${{ steps.filter.outputs.java-subprojects }}
      java-teamcity: ${{ steps.filter.outputs.java-teamcity }}
      java-root: ${{ steps.filter.outputs.java-root }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |-
            java-platforms:
              - platforms/**/'**/pom.xml'
              - platforms/**/'**/build.gradle'
              - platforms/**/'**/build.gradle.kts'
              - platforms/**/'**/*.java'
            java-build-logic:
              - build-logic/**/'**/pom.xml'
              - build-logic/**/'**/build.gradle'
              - build-logic/**/'**/build.gradle.kts'
              - build-logic/**/'**/*.java'
            java-build-logic-commons:
              - build-logic-commons/**/'**/pom.xml'
              - build-logic-commons/**/'**/build.gradle'
              - build-logic-commons/**/'**/build.gradle.kts'
              - build-logic-commons/**/'**/*.java'
            java-build-logic-settings:
              - build-logic-settings/**/'**/pom.xml'
              - build-logic-settings/**/'**/build.gradle'
              - build-logic-settings/**/'**/build.gradle.kts'
              - build-logic-settings/**/'**/*.java'
            java-packaging:
              - packaging/**/'**/pom.xml'
              - packaging/**/'**/build.gradle'
              - packaging/**/'**/build.gradle.kts'
              - packaging/**/'**/*.java'
            java-subprojects:
              - subprojects/**/'**/pom.xml'
              - subprojects/**/'**/build.gradle'
              - subprojects/**/'**/build.gradle.kts'
              - subprojects/**/'**/*.java'
            java-teamcity:
              - .teamcity/**/'**/pom.xml'
              - .teamcity/**/'**/build.gradle'
              - .teamcity/**/'**/build.gradle.kts'
              - .teamcity/**/'**/*.java'
            java-root:
              - '**/pom.xml'
              - '**/build.gradle'
              - '**/build.gradle.kts'
              - '**/*.java'
  scan-java-platforms-pr:
    name: "PR Scan: java (platforms)"
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.java-platforms == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew build -x test
      - uses: endorlabs/github-action@b8992820cc4d9c9e7ded5022adf6cabe2dc11946
        with:
          namespace: "endor-solutions-ypulse.github-ci.saber-e2e"
          scan_dependencies: true
          pr: true
          enable_pr_comments: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          enable_github_action_token: true
          additional_args: "--languages=java --include-path=platforms/** --exclude-path=testing/** --exclude-path=platforms/core-configuration/kotlin-dsl-integ-tests/** --exclude-path=platforms/core-execution/execution-e2e-tests/** --quick-scan"
