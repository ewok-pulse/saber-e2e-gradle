          additional_args: "--languages=java --exclude-path=platforms/** --exclude-path=build-logic/** --exclude-path=build-logic-commons/** --exclude-path=build-logic-settings/** --exclude-path=packaging/** --exclude-path=subprojects/** --exclude-path=.teamcity/** --exclude-path=testing/** --exclude-path=platforms/core-configuration/kotlin-dsl-integ-tests/** --exclude-path=platforms/core-execution/execution-e2e-tests/**"
          sarif_file: findings.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: findings.sarif
          category: endorlabs-java-root
    env:
      # Auto-fallback safety net — if the local build fails on a runner, endorctl uses the platform's pre-computed reachability instead of failing the job. Full deep reachability is still the primary path on success.
      ENDOR_SCAN_ENABLE_PRECOMPUTED_CALLGRAPHS: "true"