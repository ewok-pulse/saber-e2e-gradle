          additional_args: "--languages=java --include-path=platforms/** --exclude-path=testing/** --exclude-path=platforms/core-configuration/kotlin-dsl-integ-tests/** --exclude-path=platforms/core-execution/execution-e2e-tests/**"
          sarif_file: findings.sarif
